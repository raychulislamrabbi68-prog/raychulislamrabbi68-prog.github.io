<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="container">

<h1>Admin Panel</h1>
<h2>🇧🇩 বাংলা</h2>

<input type="text" id="titleBn" placeholder="বাংলা Title">

<input type="text" id="titleEn" placeholder="English Title">
<label>🇧🇩 বাংলা Category</label>

<select id="categoryBn">
    <option value="">ক্যাটাগরি নির্বাচন করুন</option>
    <option value="দুবাই ভিসা">দুবাই ভিসা</option>
    <option value="সৌদি ভিসা">সৌদি ভিসা</option>
    <option value="সিঙ্গাপুর ভিসা">সিঙ্গাপুর ভিসা</option>
    <option value="পাসপোর্ট">পাসপোর্ট</option>
    <option value="ভ্রমণ পরামর্শ">ভ্রমণ পরামর্শ</option>
    <option value="লাইফস্টাইল">লাইফস্টাইল</option>
</select>

<label>🇺🇸 English Category</label>

<select id="categoryEn">
    <option value="">Select Category</option>
    <option value="Dubai Visa">Dubai Visa</option>
    <option value="Saudi Visa">Saudi Visa</option>
    <option value="Singapore Visa">Singapore Visa</option>
    <option value="Passport">Passport</option>
    <option value="Travel Tips">Travel Tips</option>
    <option value="Lifestyle">Lifestyle</option>
</select>
<label>🇧🇩 বাংলা SEO Title</label>
<input type="text" id="seoTitleBn" placeholder="বাংলা SEO Title">

<label>🇺🇸 English SEO Title</label>
<input type="text" id="seoTitleEn" placeholder="English SEO Title">

<label>🇧🇩 বাংলা Meta Description</label>
<textarea id="metaDescriptionBn" placeholder="বাংলা Meta Description"></textarea>

<label>🇺🇸 English Meta Description</label>
<textarea id="metaDescriptionEn" placeholder="English Meta Description"></textarea>

<label>🇧🇩 বাংলা Keywords</label>
<input type="text" id="keywordsBn" placeholder="বাংলা Keywords">

<label>🇺🇸 English Keywords</label>
<input type="text" id="keywordsEn" placeholder="English Keywords">
<label>🇧🇩 বাংলা Summary</label>
<textarea id="summaryBn" placeholder="বাংলায় সংক্ষিপ্ত বিবরণ লিখুন..."></textarea>

<label>🇺🇸 English Summary</label>
<textarea id="summaryEn" placeholder="Write a short English summary..."></textarea>
<label>🇧🇩 বাংলা Blog</label>
<textarea id="contentBn" placeholder="এখানে পুরো বাংলা ব্লগ লিখুন..."></textarea>

<label>🇺🇸 English Blog</label>
<textarea id="contentEn" placeholder="Write the full English blog here..."></textarea>

<label>🇧🇩 বাংলা Image</label>

<input type="file" id="imageBn">

<button id="uploadBtnBn">
Upload Bangla Image
</button>

<br><br>

<label>🇺🇸 English Image</label>

<input type="file" id="imageEn">

<button id="uploadBtnEn">
Upload English Image
</button>

<button id="publishBtn">
Publish Blog
</button>
<p id="status"></p>

</div>

<script type="module" src="admin.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
</body>
</html>
