<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="container">

<h1>Admin Panel</h1>

<input type="text" id="title" placeholder="Blog Title">
<select id="category">
    <option value="">Select Category</option>
    <option value="Dubai Visa">Dubai Visa</option>
    <option value="Saudi Visa">Saudi Visa</option>
    <option value="Singapore Visa">Singapore Visa</option>
    <option value="Passport">Passport</option>
    <option value="Travel Tips">Travel Tips</option>
    <option value="Lifestyle">Lifestyle</option>
</select>

<input type="text" id="seoTitle" placeholder="SEO Title">

<textarea id="metaDescription" placeholder="Meta Description"></textarea>

<input type="text" id="keywords" placeholder="Keywords (comma separated)">
<textarea id="summary" placeholder="Write a short blog summary (100–200 characters)"></textarea>
<label>🇺🇸 English Blog</label>
<textarea id="contentEn" placeholder="Write your English blog..."></textarea>

<label>🇧🇩 বাংলা ব্লগ</label>
<textarea id="contentBn" placeholder="এখানে বাংলা ব্লগ লিখুন..."></textarea>

<input type="file" id="image">

<button id="publishBtn">
Publish Blog
</button>
<p id="status"></p>

</div>

<script type="module" src="admin.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
</body>
</html>
